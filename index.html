<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Sản phẩm Firestore & Upload Ảnh Cloudinary</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header>
      <h1>☁️ Quản lý Sản phẩm & Ảnh</h1>
      <p>Thêm, sửa, xóa sản phẩm Firestore & upload ảnh Cloudinary</p>
    </header>

    <section id="upload-area" class="upload-area">
      <h3>Kéo thả hoặc bấm để chọn file</h3>
      <button class="upload-btn" id="choose-btn" type="button">📁 Chọn File</button>
      <input type="file" id="file-input" accept="image/*" style="display: none" />
      <img id="image-preview" style="display: none; max-width: 200px; margin-top: 10px" />
      <br />
      <button id="upload-btn" class="upload-btn" style="display: none">☁️ Upload lên Cloudinary</button>
      <div id="upload-status"></div>
    </section>

    <section class="product-form" style="margin-top: 20px">
      <h2>Thêm sản phẩm mới</h2>
      <label>Tên sản phẩm: <input type="text" id="product-name" /></label><br /><br />
      <label>Giá: <input type="number" id="product-price" /></label><br /><br />
      <label>
        Loại:
        <select id="product-type">
          <option value="">--Chọn loại--</option>
          <option value="motor">motor</option>
          <option value="bicycle">bicycle</option>
        </select>
      </label><br /><br />
      <label>
        Engine:
        <select id="product-engine">
          <option value="">--Chọn engine--</option>
          <option value="none">none</option>
          <option value="electric">electric</option>
          <option value="gasoline">gasoline</option>
        </select>
      </label><br /><br />
      <label>Thương hiệu: <input type="text" id="product-brand" /></label><br /><br />
      <label>Link ảnh (Cloudinary): <input type="text" id="product-img" /></label><br /><br />
      <label>Mô tả: <textarea id="product-desc" rows="2"></textarea></label><br /><br />
      <button id="save-product" class="upload-btn">💾 Lưu sản phẩm vào Firestore</button>
    </section>

    <section style="margin-top: 40px">
      <h2>Danh sách sản phẩm</h2>
      <div id="product-list"></div>
      <div id="edit-form"></div>
    </section>

    <script type="module" src="./js/main.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (typeof window.renderProductList === "function") window.renderProductList();

        const saveBtn = document.getElementById("save-product");
        saveBtn.onclick = async () => {
          const name = document.getElementById("product-name").value.trim();
          const price = Number(document.getElementById("product-price").value);
          const type = document.getElementById("product-type").value;
          const engine = document.getElementById("product-engine").value;
          const brand = document.getElementById("product-brand").value.trim();
          const img = document.getElementById("product-img").value.trim();
          const desc = document.getElementById("product-desc").value.trim();

          if (!name || !type || !engine || !img || !price || !brand) {
            alert("Vui lòng nhập đầy đủ thông tin sản phẩm!");
            return;
          }

          if (typeof window.addProduct === "function") {
            await window.addProduct({ name, price, type, engine, img, brand, desc });
            document.getElementById("product-name").value = "";
            document.getElementById("product-price").value = "";
            document.getElementById("product-type").value = "";
            document.getElementById("product-engine").value = "";
            document.getElementById("product-brand").value = "";
            document.getElementById("product-img").value = "";
            document.getElementById("product-desc").value = "";
          } else {
            alert("Không tìm thấy hàm addProduct!");
          }
        };
      });
    </script>
  </body>
</html>
