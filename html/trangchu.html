<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trang chủ</title>
    <link rel="stylesheet" href="../css/trangchu.css" />
  </head>
  <body>
    <!-- Navbar động sẽ được trangchu.js sinh ra -->
    <nav id="navbar"></nav>

    <!-- Thanh tìm kiếm ở đầu trang -->
    <div style="width: 100%; text-align: center; margin: 20px 0">
      <input
        type="text"
        id="navbar-search"
        class="navbar-search"
        placeholder="Tìm kiếm theo thương hiệu, loại, engine..."
        style="max-width: 400px; width: 90%; padding: 8px"
      />
      <button id="search-btn" class="product-btn" style="margin-left: 8px">
        🔍 Tìm kiếm
      </button>
    </div>

    <!-- MAIN CONTENT -->
    <main id="main-content">
      <section id="ban" class="product-section">
        <header>
          <h2 class="product-title">Danh sách sản phẩm</h2>
          <p class="product-desc">
            Khám phá các sản phẩm xe máy, xe đạp, xe điện mới nhất!
          </p>
        </header>
        <div class="product-container">
          <div id="the" class="product-list"></div>
        </div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer class="footer" id="footer"></footer>

    <!-- Scripts -->
    <script type="module" src="../js/firebase/auth.js"></script>
    <script type="module" src="../js/firebase/firebase-config.js"></script>
    <script type="module" src="../js/trangchu.js"></script>
    <script type="module" src="../js/theme.js"></script>
  </body>
</html>
